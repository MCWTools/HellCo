<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23200a0e'/%3E%3Cpath d='M3 2l2 3M13 2l-2 3' stroke='%23ff6a1a' stroke-width='2'/%3E%3Crect x='3' y='5' width='10' height='8' fill='%23c0392b'/%3E%3Crect x='5' y='8' width='2' height='2' fill='%23fff'/%3E%3Crect x='9' y='8' width='2' height='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">

<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud" class="hide">
    <div class="hud-l"><div class="hl1"><span id="hDay"></span><span id="hQuota"></span></div><span id="hEvent"></span></div>
    <div class="hud-c">
      <div id="hRank"></div>
      <div class="kpibar"><div id="hKpiFill"></div><span id="hKpiTxt"></span></div>
    </div>
    <div class="hud-r">
      <span id="hXu" class="xu"></span>
      <button id="bCodex" class="ib" data-i18n-title="codex">&#128214;</button>
      <button id="bShop" class="ib" data-i18n-title="shop">&#128722;</button>
      <button id="bSet" class="ib" data-i18n-title="settings">&#9881;</button>
    </div>
  </div>

  <div id="side" class="hide">
    <div id="dossier" class="panel"></div>
    <div id="actions"></div>
  </div>

  <div id="bubble" class="hide"></div>
  <div id="stampPop" class="hide"></div>

  <div id="dlg" class="hide">
    <div id="dlgWho"></div>
    <div id="dlgTxt"></div>
    <div id="dlgChoices"></div>
    <div id="dlgHint">&#9660;</div>
    <button id="dlgSkip" class="mini" data-i18n="skip">Skip</button>
  </div>

  <div id="screen" class="hide"></div>
  <div id="fx"><div class="fxText"></div></div>
  <div id="toasts"></div>
  <div id="rotate"><div class="rIcon">&#8635;</div><p data-i18n="rotate">Please rotate your device</p></div>
</div>
